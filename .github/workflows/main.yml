name: Build

on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: 
      - main
      - 'update-webrtc-m*'  # Also run on WebRTC update branches
  pull_request:
    branches: 
      - main
      - 'update-webrtc-m*'  # Also run on WebRTC update branches


  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_linux:
    name: linux
    runs-on: ubuntu-latest

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y xcompmgr \
                  uuid-dev \
                  snapcraft \
                  python-psutil \
                  openbox \
                  libxtst-dev \
                  libxss-dev \
                  libxslt1-dev \
                  libxkbcommon-dev \
                  libvulkan-dev \
                  libudev-dev \
                  libspeechd2 \
                  libspeechd-dev \
                  libsctp-dev \
                  libpulse0 \
                  libpulse-dev \
                  libpci-dev \
                  libpango1.0-0 \
                  libnss3-dev \
                  libnspr4-dev \
                  libkrb5-dev \
                  libinput10 \
                  libinput-dev \
                  libgtk-3-dev \
                  libgnome-keyring0 \
                  libgnome-keyring-dev \
                  libglu1-mesa-dev \
                  libevdev2 \
                  libevdev-dev \
                  libelf-dev \
                  libdrm-dev \
                  libcurl4-gnutls-dev \
                  libcups2-dev \
                  libcap-dev \
                  libbrlapi0.6 \
                  libbrlapi-dev \
                  libbluetooth-dev \
                  libatspi2.0-dev \
                  libasound2-dev \
                  libappindicator3-dev \
                  libappindicator3-1 \
                  gperf \
                  devscripts \
                  binutils-mipsel-linux-gnu \
                  binutils-mips64el-linux-gnuabi64 \
                  binutils-arm-linux-gnueabihf \
                  binutils-aarch64-linux-gnu \
                  xcompmgr \
                  x11-utils \
                  subversion \
                  ruby \
                  rpm \
                  php7.2-cgi \
                  p7zip \
                  libxt-dev \
                  libssl-dev \
                  libsqlite3-dev \
                  libgbm-dev \
                  libffi-dev \
                  libbz2-dev \
                  libapache2-mod-php7.2 \
                  elfutils \
                  dbus-x11 \
                  cdbs \
                  apache2-bin
          sudo apt-get install -y linux-libc-dev:i386 libx11-xcb1:i386 libpci3:i386

      - name: Build
        run: ./scripts/build_linux.sh

      - name: Package
        run: ./scripts/package.sh
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: webrtc_*.zip

  build_macos:
    name: macOS
    runs-on: macos-latest

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build_iosx.sh

      - name: Package
        run: ./scripts/package.sh
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: webrtc_*.zip

  create_release:
    name: Create Release
    needs: [build_linux, build_macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/update-webrtc-m')
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Load version info
        run: |
          source scripts/version.sh
          echo "WEBRTC_RELEASE=$WEBRTC_RELEASE" >> $GITHUB_ENV
          echo "WEBRTC_COMMIT=$WEBRTC_COMMIT" >> $GITHUB_ENV
          echo "RELEASE_TAG=$WEBRTC_RELEASE.${{ github.run_number }}" >> $GITHUB_ENV
      
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: ./artifacts
      
      - name: Download macOS Artifacts  
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./artifacts
          
      - name: Create GitHub Release
        run: |
          cat > release_notes.md << 'EOF'
          ## WebRTC Prebuilt Binaries

          **Version:** ${{ env.RELEASE_TAG }}
          **WebRTC Commit:** ${{ env.WEBRTC_COMMIT }}
          **Build Date:** ${{ github.run_number }}

          This release contains prebuilt WebRTC binaries for:
          - Linux (x86_64, Android ARM/ARM64/x86/x86_64)  
          - macOS (x86_64, ARM64)
          - iOS (ARM64, Simulator)

          Built automatically from the latest stable WebRTC release.
          EOF
          
          gh release create "$RELEASE_TAG" \
            --title "WebRTC $RELEASE_TAG" \
            --notes-file release_notes.md \
            ./artifacts/webrtc_*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

